<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSM Attendance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:15px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#fff;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:10px;
}

.info{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    margin-bottom:10px;
    font-weight:bold;
}

select{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:18px;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-bottom:15px;
    gap:10px;
    font-weight:bold;
    font-size:18px;
}

.stats div{
    flex:1;
    background:#f5f5f5;
    padding:15px;
    text-align:center;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(55px,1fr));
    gap:8px;
}

.roll{
    border:none;
    border-radius:8px;
    padding:12px 0;
    background:#2196f3;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.roll.absent{
    background:#f44336;
}

.buttons{
    margin-top:20px;
    display:grid;
    gap:10px;
}

.action{
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    color:white;
}

.copy-present{
    background:#4caf50;
}

.copy-absent{
    background:#ff9800;
}

.copy-report{
    background:#673ab7;
}

textarea{
    width:100%;
    height:120px;
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>📋 Attendance</h2>

<div class="info">
<span>Date: <span id="date"></span></span>
</div>

<select id="classSelect">
    <option value="">Select Class</option>

    <option>2nd Year CSM - A Sec</option>
    <option>2nd Year CSM - B Sec</option>
    <option>3rd Year CSM - A Sec</option>
    <option>4th Year CSM - A Sec</option>
    <option>4th Year CSM - B Sec</option>
</select>

<div style="display:flex; gap:10px;">

    <button class="action copy-present" style="flex:1;" onclick="loadStudents()">
        Load Students
    </button>

    <button class="action copy-report" style="flex:1;" onclick="showManageClasses()">
        Manage Classes
    </button>

    <button class="action copy-report" onclick="copyReport()">
        Copy Report
    </button>

</div>

<div id="manageBox" style="display:none; margin-top:15px;">

<div class="card">

<h3>Your Classes</h3>

<div id="classList"></div>

<button class="action copy-present" onclick="addClass()">
+ Add New Class
</button>

<button class="action copy-report" onclick="exportClasses()">
Export Classes (Backup)
</button>

<button class="action copy-absent" onclick="importClasses()">
Import Classes (Restore)
</button>

</div>

</div>



<div class="stats">
<div>✅ Present: <span id="presentCount">66</span></div>
<div>❌ Absent: <span id="absentCount">0</span></div>
</div>

<div class="grid" id="grid"></div>

<div class="buttons">
<button class="action copy-present" onclick="copyPresentees()">
Copy Presentees
</button>

<button class="action copy-absent" onclick="copyAbsentees()">
Copy Absentees
</button>

<button class="action" style="background:#009688;" onclick="saveAttendance()">
    💾 Save Attendance
</button>

<button class="action copy-report" onclick="copyReport()">
Copy Report
</button>

<button class="action copy-report" onclick="sendWhatsApp()">
Send in WhatsApp
</button>
</div>

<textarea id="preview" readonly></textarea>

</div>
</div>

function updateCounts(){

function getAbsentees(){

    let regular = [];
    let lateral = [];

    [...absentSet]
    .sort((a,b)=>a-b)
    .forEach(i=>{

        let student = currentStudents[i];

        if(student.roll.includes("T5A")){

            lateral.push(student.roll.slice(-2));

        }
        else{

            let regNo = currentStudents
            .slice(0,i+1)
            .filter(s=>!s.roll.includes("T5A"))
            .length;

            if(student.roll === "238T1A4214"){
                regular.push(student.roll);
            }
            else{
                regular.push(student.roll.slice(-2));
            }

        }

    });


    return {
        regular:regular,
        lateral:lateral
    };

}

function saveAttendance(){

    const cls = document.getElementById("classSelect").value;

    if(currentStudents.length === 0){
        alert("Please select class and load students first");
        return;
    }


    let year = "";

    if(cls.startsWith("2nd Year")){
        year = "2nd Year";
    }
    else if(cls.startsWith("3rd Year")){
        year = "3rd Year";
    }
    else if(cls.startsWith("4th Year")){
        year = "4th Year";
    }


let section = "";

if(cls.includes("A Sec")){
    section = "CSM-A";
}
else if(cls.includes("B Sec")){
    section = "CSM-B";
}


    const p = getPresentees();
    const a = getAbsentees();

    const data = {

        date: `${dd}/${mm}/${yyyy}`,

        year: year,

        section: section,

        total: currentStudents.length,

        present: p.regular.length + p.lateral.length,

        absent: a.regular.length + a.lateral.length

    };


    fetch(scriptURL, {

        method:"POST",

        body:JSON.stringify(data)

    })

    .then(response=>response.text())

    .then(result=>{

        alert("✅ Attendance Saved Successfully");

        console.log(result);

    })

    .catch(error=>{

        alert("❌ Error saving attendance");

        console.log(error);

    });

}

function generateReport(){

    const cls = document.getElementById("classSelect").value;

    const presentees = getPresentees();
    const absentees = getAbsentees();

    let presentText = "";

    if(presentees.regular.length > 0){
        presentText += presentees.regular.join(", ");
    }

    if(presentees.lateral.length > 0){

        if(presentText !== ""){
            presentText += "\n";
        }

        presentText += "LE's:- ";
        presentText += presentees.lateral.join(", ");

    }


    // Add detained student full roll number
    let detainedText = "";

    if(specialStudents[cls]){

    presentText += "Other Student:-";

    specialStudents[cls].forEach(s => {
        presentText += s.roll + " - " + s.name + "\n";
    });

}


    let absentText = "";

    if(absentees.regular.length > 0){

        absentText += absentees.regular.join(", ");

    }

    if(absentees.lateral.length > 0){

        if(absentText !== ""){
            absentText += "\n";
        }

        absentText += "LE's:- ";
        absentText += absentees.lateral.join(", ");

    }


return `*Attendance*
*Date:* ${dd}/${mm}/${yyyy}
*Class:* ${cls}
*Total Students:* ${currentStudents.length + (specialStudents[cls] ? specialStudents[cls].length : 0)}

*Presentees:* ${presentees.regular.length + presentees.lateral.length}
${presentText}
${detainedText}
*Absentees:* ${absentees.regular.length + absentees.lateral.length}
${absentText}`;

}
